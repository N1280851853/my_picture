server:
  port: 8123
  servlet:
    context-path: /api
    multipart:
      max-file-size: 5MB   # 设置单个文件最大大小
      max-request-size: 10MB  # 设置总上传大小（多个文件时）

spring:
  profiles:
    active: local
  application:
    name: yu-picture-backend

mybatis-plus:
  configuration:
    # MyBatis 配置
    map-underscore-to-camel-case: true
    #查询出来的属性如果为null值，默认是不返回这个属性字段的，需要配置为true
    call-setters-on-nulls: true
  global-config:
    db-config:
      # 指定逻辑删除字段
      logic-delete-value: 1 # 逻辑已删除值（默认是 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认是 0）



knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: v1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.whc.picture